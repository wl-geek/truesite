# Weekly dependency updates. Minor and patch bumps come grouped in one pull request per folder; majors one by one.
# server/: after a uv update, regenerate the image's hash-pinned requirements (command in server/requirements.txt);
# server/tests/test_requirements.py fails CI until it matches uv.lock.
version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web/e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /bim
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      bim-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
