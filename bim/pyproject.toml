[project]
name = "truesite-bim"
version = "0.1.0"
description = "TrueSite offline BIM pipeline: IFC -> model.glb + elements.json, plus printable QR anchor sheets"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ifcopenshell==0.9.0",  # 0.9 API required: convert.py fails on 0.8.5 ("Setting not available")
    "segno==1.6.6",
    "reportlab==5.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pymupdf==1.28.2",  # tests only (AGPL): reads PDF vector coordinates, renders pages
    "zxing-cpp==3.1.1",  # tests only: decodes the rendered QR codes
]

[tool.uv]
package = false  # scripts run with `python -m truesite_bim.<module>` from bim/
